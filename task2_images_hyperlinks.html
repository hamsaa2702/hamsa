<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task 2 - Images and Hyperlinks</title>
<style>
  body {
    background-image: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1200');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: white;
    font-family: Arial, sans-serif;
    text-shadow: 1px 1px 3px black;
    padding: 40px;
  }
  .box {
    background-color: rgba(0,0,0,0.5);
    padding: 20px;
    border-radius: 10px;
    max-width: 600px;
  }
  a { color: yellow; }
</style>
</head>
<body>

<div class="box">
  <h2>a) Image as a Background</h2>
  <p>This entire page uses a scenic image set as the background using CSS (background-image property).</p>

  <h2>b) Hyperlink Using an Image</h2>
  <p>Click the image below to visit Google:</p>
  <a href="https://www.google.com" target="_blank">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Google_2015_logo.svg/320px-Google_2015_logo.svg.png" 
         alt="Google Logo" width="200">
  </a>

  <h2>c) Hyperlink to Another Web Page</h2>
  <p>
    <a href="https://www.wikipedia.org" target="_blank">Click here to visit Wikipedia</a>
  </p>
</div>

</body>
</html>
